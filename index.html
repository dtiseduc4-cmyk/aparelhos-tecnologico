<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parque Tecnológico das Escolas</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDy5RrvnwBf0s4LyBlN5LzvySxscgGslxI",
      authDomain: "aparelhos-tecnologicos.firebaseapp.com",
      projectId: "aparelhos-tecnologicos",
      storageBucket: "aparelhos-tecnologicos.firebasestorage.app",
      messagingSenderId: "856637181859",
      appId: "1:856637181859:web:22582e4499a2186ae65416",
      measurementId: "G-M1WS039T3Q"
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch (e) {}
    window.db = getFirestore(app);
  </script>

  <!-- jsPDF para exportação -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
  <header>
    <h1>Parque Tecnológico das Escolas</h1>
    <nav>
      <a href="#" id="menuCadastro" class="active">Cadastro</a>
      <a href="#" id="menuConsulta">Consulta</a>
      <a href="#" id="menuClassificacao">Classificação</a>
    </nav>
  </header>

  <main>
    <!-- Página 1: Cadastro -->
<section id="paginaCadastro" class="pagina ativa">
  <h2>Cadastro de Equipamentos</h2>
  <form id="formCadastro">
    <div class="form-grid">
      <div class="form-group">
        <label for="equipamento">Equipamento:</label>
        <input type="text" id="equipamento" name="equipamento" placeholder="Ex: Notebook Dell Inspiron" required>
      </div>

      <div class="form-group">
        <label for="numeroSerie">Número de Série:</label>
        <input type="text" id="numeroSerie" name="numeroSerie" placeholder="Ex: SN-12345678" required>
      </div>

      <div class="form-group">
        <label for="status">Status:</label>
        <select id="status" name="status" required>
          <option value="">Selecione</option>
          <option value="Disponível">Disponível</option>
          <option value="Em Uso">Em Uso</option>
          <option value="Manutenção">Manutenção</option>
        </select>
      </div>

      <div class="form-group">
        <label for="localizacao">Localização:</label>
        <input type="text" id="localizacao" name="localizacao" placeholder="Ex: Laboratório 1 - Bloco B" required>
      </div>

      <div class="form-group form-full">
        <label for="observacoes">Observações:</label>
        <textarea id="observacoes" name="observacoes" placeholder="Insira informações adicionais sobre o equipamento..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button id="btnSalvar" type="submit">Salvar</button>
      <button id="btnCancelarEdicao" type="button" class="hide">Cancelar Edição</button>
    </div>
  </form>
</section>


    <!-- Página 2: Consulta -->
    <section id="paginaConsulta" class="pagina">
      <h2>Consulta de Registros</h2>
      <input type="text" id="pesquisaConsulta" placeholder="Pesquisar...">

      <table id="tabelaConsulta">
        <thead>
          <tr>
            <th>Escola</th>
            <th>Roteadores</th>
            <th>Switchs</th>
            <th>Leitores</th>
            <th>Provedor</th>
            <th>Medidor</th>
            <th>Solicitação</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <button id="btnExportar">Exportar PDF</button>
    </section>

    <!-- Página 3: Classificação -->
    <section id="paginaClassificacao" class="pagina">
      <h2>Classificação por Status</h2>
      <input type="text" id="pesquisaClassificacao" placeholder="Pesquisar...">

      <table id="tabelaClassificacao">
        <thead>
          <tr>
            <th>Escola</th>
            <th>Solicitação</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Toasts -->
  <div id="toasts"></div>

  <!-- Script principal -->
  <script type="module" src="script.js"></script>
</body>
</html>
